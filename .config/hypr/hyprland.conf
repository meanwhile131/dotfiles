monitor = eDP-1, highres, auto, 1
exec-once = hyprctl setcursor Breeze 24
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar & hyprpaper & Telegram -startintray & wl-paste --watch cliphist store
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }


    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
dwindle {
    pseudotile = true
    preserve_split = true
}
master {
    new_status = master
}
misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
    enable_anr_dialog = false
    vfr = true
}
input {
    kb_options = caps:none
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
    }
}
device {
    name = logitech-wireless-mouse-
    sensitivity = -0.8
}
gestures {
    workspace_swipe = false
}
$mainMod = SUPER
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, A, exec, firefox
bind = $mainMod, B, togglefloating
bind = $mainMod, X, exec, cliphist list | wofi --show dmenu | cliphist decode | wl-copy
bind = $mainMod, R, exec, wofi --show run
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = , Print, exec, grimblast copysave area
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, L, exec, hyprlock
# bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind =, XF86AudioMute, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 200%+
bindr =, XF86AudioMute, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 200%-
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-s
binde = ,XF86AudioPlay, exec, playerctl play-pause
bind = $mainMod, F, fullscreen, 2
bind = ,Home,pass,class:^(com\.obsproject\.Studio)$
bind = ,End,pass,class:^(com\.obsproject\.Studio)$
windowrulev2 = fullscreen, class:Terraria.bin.x86_64
windowrulev2 = float, class: firefox, title:""
